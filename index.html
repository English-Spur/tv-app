<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#0a0e16" />
<title>ENGLISH SPUR TV — আমার পার্সোনাল টিভি</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js"></script>
<style>
  *{box-sizing:border-box}
  :root{
    --bg:#0a0e16; --panel:#111827; --line:#25314a;
    --text:#e9eefb; --muted:#8fa0bd;
    --grad:linear-gradient(135deg,#7c5cff,#00d4ff);
    --danger:#ff4d5e; --ok:#22d37a; --warn:#ffb020;
  }
  html,body{height:100%}
  body{
    margin:0; overflow:hidden; color:var(--text);
    font-family:'Segoe UI',system-ui,-apple-system,'Noto Sans Bengali',sans-serif;
    background:radial-gradient(1200px 700px at 12% -12%,#1b2540 0%,transparent 60%),var(--bg);
  }
  .app{display:grid;grid-template-columns:340px 1fr;height:100dvh}

  .sidebar{
    display:flex;flex-direction:column;min-height:0;
    background:linear-gradient(180deg,#0e1421,#0a0e16);
    border-right:1px solid var(--line);
  }
  .brand{display:flex;align-items:center;gap:11px;padding:16px 16px 10px}
  .brand .dot{
    width:36px;height:36px;border-radius:11px;background:var(--grad);
    display:grid;place-items:center;font-weight:800;color:#08101f;font-size:15px;
    box-shadow:0 6px 20px rgba(124,92,255,.45);
  }
  .brand h1{font-size:15px;margin:0;letter-spacing:.4px}
  .brand p{margin:1px 0 0;font-size:11px;color:var(--muted)}
  
  .search-wrap{padding:0 14px 8px}
  .search{
    width:100%;padding:10px 12px;border-radius:11px;border:1px solid var(--line);
    background:#0c1320;color:var(--text);font-size:13px;outline:none;font-family:inherit;
  }
  .search:focus{border-color:#3b6cff;box-shadow:0 0 0 3px rgba(59,108,255,.15)}

  .tabs-wrap{
    padding:0 14px 10px; display:flex; gap:6px; overflow-x:auto; scrollbar-width:none;
  }
  .tabs-wrap::-webkit-scrollbar{display:none}
  .tab{
    padding:6px 12px; border-radius:8px; font-size:12px; font-weight:600;
    background:#151e30; border:1px solid var(--line); color:var(--muted);
    cursor:pointer; white-space:nowrap; transition:.2s; font-family:inherit;
  }
  .tab:hover{background:#1d2942; color:var(--text)}
  .tab.active{background:var(--grad); border-color:transparent; color:#07101e}

  .list-head{padding:0 15px 8px;font-size:11px;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .list{flex:1;overflow-y:auto;padding:2px 10px 10px;min-height:0}
  .list::-webkit-scrollbar{width:6px}
  .list::-webkit-scrollbar-thumb{background:#26314a;border-radius:8px}

  .ch{
    width:100%;display:flex;align-items:center;gap:8px;
    padding:10px 8px;margin-bottom:6px;border-radius:12px;cursor:pointer;
    background:transparent;border:1px solid transparent;color:var(--text);
    text-align:left;font-family:inherit;transition:.16s;
  }
  .ch:hover{background:#141d2e;border-color:var(--line)}
  .ch.active{background:linear-gradient(90deg,rgba(124,92,255,.22),rgba(0,212,255,.07));border-color:#3d4f7a}
  
  /* ম্যানুয়ালি ব্লক করা চ্যানেলের স্টাইল */
  .ch.blocked{opacity:0.4;filter:grayscale(1);}

  .ch-num{
    font-size:11.5px;color:var(--muted);min-width:22px;text-align:right;
    font-weight:600;flex:0 0 auto;font-variant-numeric:tabular-nums;
  }
  .ch.active .ch-num{color:#9fc4ff}

  .ch-logo{
    width:34px;height:34px;flex:0 0 34px;border-radius:8px;display:grid;place-items:center;
    font-weight:800;font-size:10px;background:#1c2740;color:#9fc4ff;text-transform:uppercase;
  }
  .ch.active .ch-logo{background:var(--grad);color:#08101f}
  .ch-meta{display:flex;flex-direction:column;min-width:0;flex:1}
  .ch-name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ch-sub{font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ch-status{width:7px;height:7px;border-radius:50%;flex:0 0 auto;background:#3a4763}
  .ch-status.ok{background:var(--ok);box-shadow:0 0 8px rgba(34,211,122,.7)}
  .ch-status.dead{background:var(--danger)}
  .ch-status.checking{background:var(--warn);animation:pulse 1s infinite}
  
  /* ব্লক বাটনের স্টাইল */
  .ch-block{
    opacity:0;padding:6px;border-radius:8px;font-size:12px;color:var(--muted);
    transition:.15s;flex:0 0 auto;cursor:pointer; background:transparent; border:none;
  }
  .ch:hover .ch-block{opacity:1}
  .ch-block:hover{background:#2a1220;color:var(--danger)}
  .ch.blocked .ch-block{opacity:1; color:var(--ok);} /* আনব্লক করার জন্য সবুজ */

  .empty{color:var(--muted);font-size:12.5px;text-align:center;padding:26px 8px;line-height:1.8}

  .sidebar-foot{
    padding:12px 14px;border-top:1px solid var(--line);
    display:flex;flex-direction:column;gap:8px;
  }
  .foot-row{display:flex;align-items:center;gap:8px}
  .toggle{
    display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);
    cursor:pointer;user-select:none;white-space:nowrap;
  }
  .toggle input{accent-color:#7c5cff;width:14px;height:14px;cursor:pointer}

  .main{display:flex;flex-direction:column;gap:14px;padding:18px;min-width:0;overflow-y:auto}
  .nowbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .nowbar h2{margin:0;font-size:17px}
  .badge{
    font-size:10.5px;font-weight:700;letter-spacing:.8px;padding:3px 8px;border-radius:6px;
    background:#2a1220;color:#ff6b7d;border:1px solid #4a1c2a;display:flex;align-items:center;gap:5px;
  }
  .badge .pulse{width:6px;height:6px;border-radius:50%;background:#ff4d5e;animation:pulse 1.4s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
  .nowbar .sub{font-size:12px;color:var(--muted)}

  .stage{
    position:relative;width:100%;aspect-ratio:16/9;background:#000;
    border-radius:18px;overflow:hidden;border:1px solid var(--line);
    box-shadow:0 24px 70px rgba(0,0,0,.55);
  }
  video{width:100%;height:100%;display:block;object-fit:contain;background:#000}

  .big-play{
    position:absolute;inset:0;margin:auto;width:76px;height:76px;border-radius:50%;
    border:none;cursor:pointer;background:rgba(124,92,255,.92);color:#fff;font-size:26px;
    display:grid;place-items:center;opacity:0;pointer-events:none;transition:.2s;
    box-shadow:0 12px 40px rgba(124,92,255,.5);
  }
  .big-play.show{opacity:1;pointer-events:auto}
  .big-play:hover{transform:scale(1.06)}

  .err{
    position:absolute;inset:0;display:none;place-items:center;text-align:center;padding:24px;
    background:linear-gradient(180deg,rgba(6,10,18,.88),rgba(6,10,18,.97));
  }
  .err.show{display:grid}
  .err h3{margin:0 0 8px;font-size:15px}
  .err p{margin:0;font-size:12.5px;color:var(--muted);max-width:440px;line-height:1.75}
  .err .spin{
    display:inline-block;width:20px;height:20px;border:2px solid #3a4763;
    border-top-color:#7c5cff;border-radius:50%;animation:spin .8s linear infinite;margin-bottom:12px;
  }
  @keyframes spin{to{transform:rotate(360deg)}}

  .controls{
    position:absolute;left:0;right:0;bottom:0;padding:26px 14px 12px;
    display:flex;align-items:center;gap:10px;
    background:linear-gradient(180deg,transparent,rgba(4,8,14,.92));
    opacity:0;transition:.25s;
  }
  .stage:hover .controls,.controls.show{opacity:1}
  .cbtn{
    background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.09);
    color:#fff;width:38px;height:38px;border-radius:10px;cursor:pointer;font-size:14px;
    display:grid;place-items:center;transition:.15s;flex:0 0 auto;
  }
  .cbtn:hover{background:rgba(255,255,255,.18)}
  .cbtn.wide{width:auto;padding:0 13px;font-size:12px;font-weight:600;gap:6px}
  input[type=range]{
    -webkit-appearance:none;appearance:none;height:4px;border-radius:4px;width:92px;
    background:rgba(255,255,255,.25);outline:none;cursor:pointer;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:#fff;
  }
  .spacer{flex:1}
  .btn{
    padding:9px 15px;border-radius:11px;border:1px solid var(--line);background:#151e30;
    color:var(--text);font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;
    transition:.15s;
  }
  .btn:hover{background:#1d2942}
  .btn.primary{background:var(--grad);border:none;color:#07101e}
  .btn.primary:hover{filter:brightness(1.12)}
  .btn.full{width:100%}

  @media (max-width:900px){
    .app{grid-template-columns:1fr;grid-template-rows:1fr auto}
    .main{order:1;padding:12px;gap:10px}
    .sidebar{order:2;border-right:none;border-top:1px solid var(--line);max-height:44dvh}
    .nowbar h2{font-size:15px}
    input[type=range]{width:64px}
  }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="dot">B</div>
      <div>
        <h1>SHOVAN TV</h1>
        <p>আমার পার্সোনাল টিভি</p>
      </div>
    </div>
    <div class="search-wrap">
      <input id="search" class="search" type="search" placeholder="🔍  চ্যানেল খুঁজুন (যেমন: ABP, Star)..." />
    </div>
    
    <div class="tabs-wrap" id="categoryTabs">
      <button class="tab active" data-cat="All">সব</button>
      <button class="tab" data-cat="English">English</button>
      <button class="tab" data-cat="বাংলা">বাংলা</button>
      <button class="tab" data-cat="हिंदी">हिंदी</button>
      <button class="tab" data-cat="Odia">Odia</button>
    </div>

    <div class="list-head" id="listHead">ডাটাবেস লোড হচ্ছে...</div>
    <div id="channelList" class="list"></div>
    
    <div class="sidebar-foot">
      <button class="btn primary full" id="btnLoadMain">🌐 মেইন ডাটাবেস লোড করুন</button>
      <div class="foot-row" style="margin-top:6px">
        <label class="toggle"><input type="checkbox" id="showBlocked"><span>ব্লক/মৃত চ্যানেল দেখাও</span></label>
      </div>
    </div>
  </aside>

  <main class="main">
    <div class="nowbar">
      <h2 id="npName">চ্যানেল সিলেক্ট করুন</h2>
      <span class="badge" id="liveBadge" style="display:none"><span class="pulse"></span>LIVE</span>
      <span class="sub" id="npGroup"></span>
    </div>

    <div class="stage" id="stage">
      <video id="video" playsinline crossorigin="anonymous"></video>
      <button class="big-play" id="bigPlay" aria-label="Play">▶</button>

      <div class="err" id="errBox">
        <div>
          <div class="spin" id="errSpin"></div>
          <h3 id="errTitle">স্ট্রিম পাওয়া যায়নি</h3>
          <p id="errText"></p>
        </div>
      </div>

      <div class="controls" id="controls">
        <button class="cbtn" id="btnPlay" title="Play/Pause (Space)">▶</button>
        <button class="cbtn" id="btnMute" title="Mute (M)">🔊</button>
        <input id="vol" type="range" min="0" max="1" step="0.01" value="1" />
        <div class="spacer"></div>
        <button class="cbtn wide" id="btnReload" title="রিলোড">↻ রিলোড</button>
        <button class="cbtn" id="btnPip" title="Picture in Picture">⧉</button>
        <button class="cbtn" id="btnFs" title="Fullscreen (F)">⛶</button>
      </div>
    </div>
  </main>
</div>

<script>
(() => {
  'use strict';

  const $  = (s, el = document) => el.querySelector(s);
  const $$ = (s, el = document) => [...el.querySelectorAll(s)];
  const esc = s => String(s ?? '').replace(/[&<>"']/g, m =>
    ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[m]));
  const uid = () => (crypto.randomUUID?.() || 'id' + Date.now() + Math.random().toString(36).slice(2, 8));

  const MAIN_M3U_URL = 'https://iptv-org.github.io/iptv/index.m3u';
  
  const LANG_URLS = {
    'English': 'https://iptv-org.github.io/iptv/languages/eng.m3u',
    'বাংলা': 'https://iptv-org.github.io/iptv/languages/ben.m3u',
    'हिंदी': 'https://iptv-org.github.io/iptv/languages/hin.m3u',
    'Odia': 'https://iptv-org.github.io/iptv/languages/ori.m3u'
  };

  const LS_BLOCKED = 'bosstv.blocked.v1';
  
  let channels = [];
  let health = {};
  let manualBlocked = new Set(JSON.parse(localStorage.getItem(LS_BLOCKED)) || []);
  
  const checking = new Set();
  let currentId = null;
  let currentCategory = 'All';
  let hls = null;
  let hasError = false;
  let isFetching = false;
  const fetchedLanguages = new Set(); 
  let renderLimit = 150; 

  const video = $('#video');
  const stage = $('#stage');
  const listEl = $('#channelList');
  const listHead = $('#listHead');
  const searchEl = $('#search');
  const showBlockedEl = $('#showBlocked');
  const errBox = $('#errBox');
  const errSpin = $('#errSpin');
  const errTitle = $('#errTitle');
  const errText = $('#errText');
  const bigPlay = $('#bigPlay');
  const controls = $('#controls');
  const volEl = $('#vol');

  function saveBlocked() {
    localStorage.setItem(LS_BLOCKED, JSON.stringify([...manualBlocked]));
  }

  const statusOf = id => checking.has(id) ? 'checking' : (health[id] === false ? 'dead' : (health[id] === true ? 'ok' : 'unknown'));

  function parseM3U(text, targetArray, sourceLang = 'All') {
    const lines = text.split('\n');
    let currentInfo = null;
    let added = 0;

    for (let i = 0; i < lines.length; i++) {
      const line = lines[i].trim();
      if (line.startsWith('#EXTINF:')) {
        currentInfo = { name: 'Unknown', logo: 'TV', group: 'Other' };
        
        const nameMatch = line.match(/,(.+)$/);
        if (nameMatch) currentInfo.name = nameMatch[1].trim();
        
        const groupMatch = line.match(/group-title="([^"]+)"/);
        if (groupMatch) currentInfo.group = groupMatch[1].trim();
        
      } else if (line && !line.startsWith('#') && currentInfo) {
        const n = currentInfo.name.toLowerCase();
        const g = currentInfo.group.toLowerCase();
        if (!n.includes('xxx') && !n.includes('adult') && !g.includes('xxx') && !g.includes('adult')) {
          targetArray.push({
            id: uid(),
            name: currentInfo.name,
            url: line,
            logo: currentInfo.name.slice(0, 3).toUpperCase(),
            group: currentInfo.group,
            sourceLang: sourceLang
          });
          added++;
        }
        currentInfo = null;
      }
    }
    return added;
  }

  async function loadMainDatabase() {
    if (isFetching) return;
    isFetching = true;
    showError('মেইন ডাটাবেস লোড হচ্ছে…', 'প্রায় ১০ হাজার চ্যানেলের লিস্ট আনা হচ্ছে, অপেক্ষা করুন।', true);
    listHead.textContent = 'ডাটাবেস ডাউনলোড হচ্ছে...';

    try {
      const res = await fetch(MAIN_M3U_URL);
      if (!res.ok) throw new Error('Network error');
      const text = await res.text();
      
      channels = []; 
      const added = parseM3U(text, channels, 'All'); 

      if (added === 0) throw new Error('No channels parsed');

      showError('ডাটাবেস লোড সফল!', `${added}টি চ্যানেল পাওয়া গেছে।`);
      isFetching = false;
      renderList();

    } catch (err) {
      isFetching = false;
      showError('লোড করা যায়নি', 'ইন্টারনেট বা CORS সমস্যা থাকতে পারে। আবার চেষ্টা করুন।');
      listHead.textContent = 'লোড ব্যর্থ';
    }
  }

  $('#btnLoadMain').onclick = loadMainDatabase;

  async function loadLanguage(lang) {
    if (fetchedLanguages.has(lang)) return;
    
    showError(`${lang} চ্যানেল লোড হচ্ছে…`, 'iptv-org থেকে চ্যানেল আনা হচ্ছে।', true);
    try {
      const res = await fetch(LANG_URLS[lang]);
      if (!res.ok) throw new Error('Fetch failed');
      const text = await res.text();
      
      const added = parseM3U(text, channels, lang); 
      fetchedLanguages.add(lang);
      
      showError('লোড সফল!', `${added}টি ${lang} চ্যানেল পাওয়া গেছে।`);
      renderList();
    } catch (err) {
      showError('লোড করা যায়নি', `${lang} চ্যানেল আনা সম্ভব হয়নি।`);
    }
  }

  $('#categoryTabs').addEventListener('click', e => {
    if (!e.target.classList.contains('tab')) return;
    $$('.tab').forEach(t => t.classList.remove('active'));
    e.target.classList.add('active');
    
    const newCat = e.target.dataset.cat;
    currentCategory = newCat;
    renderLimit = 150; 
    
    if (currentCategory !== 'All' && !fetchedLanguages.has(currentCategory)) {
      loadLanguage(currentCategory);
    } else {
      renderList();
    }
  });

  function visibleChannels() {
    const q = searchEl.value.trim().toLowerCase();
    const showBlocked = showBlockedEl.checked;
    
    return channels.filter(c => {
      // ম্যানুয়ালি ব্লক করা চ্যানেল ফিল্টার
      if (!showBlocked && manualBlocked.has(c.url)) return false;
      
      // অটোমেটিক ডেড চ্যানেল ফিল্টার (যদি ম্যানুয়াল "দেখাও" অন না থাকে)
      if (!showBlocked && health[c.id] === false) return false;

      // ল্যাঙ্গুয়েজ ফিল্টার
      if (currentCategory !== 'All' && c.sourceLang !== currentCategory) return false;
      
      // সার্চ ফিল্টার
      if (!q) return true;
      return c.name.toLowerCase().includes(q) || (c.group || '').toLowerCase().includes(q);
    });
  }

  function renderList() {
    const items = visibleChannels();
    const okCount = items.filter(c => health[c.id] === true).length;
    
    listHead.innerHTML = `<span>মোট: ${items.length}টি চ্যানেল</span>`;
    if (okCount > 0) listHead.innerHTML += `<span style="color:#22d37a">● ${okCount} চলছে</span>`;

    if (!items.length) {
      listEl.innerHTML = `<p class="empty">এই ক্যাটাগরিতে কোনো চ্যানেল পাওয়া যায়নি।</p>`;
      return;
    }

    const toRender = items.slice(0, renderLimit);
    
    listEl.innerHTML = toRender.map((c, index) => {
      const st = statusOf(c.id);
      const isManuallyBlocked = manualBlocked.has(c.url);
      
      return `
      <button class="ch ${c.id === currentId ? 'active' : ''} ${isManuallyBlocked ? 'blocked' : ''}" data-id="${esc(c.id)}">
        <span class="ch-num">${index + 1}.</span>
        <span class="ch-logo">${esc(c.logo)}</span>
        <span class="ch-meta">
          <span class="ch-name">${esc(c.name)}</span>
          <span class="ch-sub">${esc(c.group)}</span>
        </span>
        <span class="ch-status ${st}"></span>
        <button class="ch-block" data-block="${esc(c.url)}" title="${isManuallyBlocked ? 'আনব্লক করুন' : 'লুকিয়ে ফেলুন'}">🚫</button>
      </button>`;
    }).join('');

    if (items.length > renderLimit) {
      listEl.innerHTML += `<button class="btn full" id="btnLoadMore" style="margin-top:10px">আরও ${items.length - renderLimit}টি চ্যানেল দেখুন</button>`;
      $('#btnLoadMore').onclick = () => {
        renderLimit += 150;
        renderList();
      };
    }
  }

  searchEl.addEventListener('input', () => {
    renderLimit = 150; 
    renderList();
  });
  
  showBlockedEl.addEventListener('change', renderList);

  function destroyHls() {
    if (hls) { try { hls.destroy(); } catch {} hls = null; }
  }

  function showError(title, text, spinning = false) {
    hasError = true;
    errTitle.textContent = title;
    errText.textContent = text;
    errSpin.style.display = spinning ? 'inline-block' : 'none';
    errBox.classList.add('show');
    bigPlay.classList.remove('show');
    $('#liveBadge').style.display = 'none';
  }
  function hideError() { hasError = false; errBox.classList.remove('show'); }

  function safePlay() {
    const p = video.play();
    if (p && typeof p.catch === 'function') p.catch(() => syncUI());
  }

  async function testStream(url, timeout = 6000) {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), timeout);
    try {
      await fetch(url, { signal: ctrl.signal, mode: 'no-cors' });
      clearTimeout(timer);
      return true; 
    } catch (err) {
      clearTimeout(timer);
      return false; 
    }
  }

  async function playChannel(ch) {
    if (!ch) return;
    
    // যদি ম্যানুয়ালি ব্লক করা থাকে, প্লে হবে না
    if (manualBlocked.has(ch.url) && !showBlockedEl.checked) return;

    currentId = ch.id;
    $('#npName').textContent = ch.name;
    $('#npGroup').textContent = ch.group;
    renderList();
    hideError();
    destroyHls();

    video.pause();
    video.removeAttribute('src');
    video.load();

    if (statusOf(ch.id) === 'unknown') {
      showError('লোড হচ্ছে…', 'চ্যানেলটি যাচাই করা হচ্ছে।', true);
      checking.add(ch.id); renderList();
      
      const ok = await testStream(ch.url);
      
      checking.delete(ch.id);
      health[ch.id] = ok;
      renderList();
      
      if (!ok) {
        showError('চ্যানেলটি বন্ধ', 'এই লিংকটি এখন কাজ করছে না।');
        return;
      }
    } else if (statusOf(ch.id) === 'dead') {
      showError('চ্যানেলটি বন্ধ', 'এই লিংকটি কাজ করছে না।');
      return;
    }

    hideError();
    const isHls = /\.m3u8(\?|#|$)/i.test(ch.url);

    if (isHls && window.Hls && Hls.isSupported()) {
      hls = new Hls({ lowLatencyMode: true });
      hls.loadSource(ch.url);
      hls.attachMedia(video);
      hls.on(Hls.Events.MANIFEST_PARSED, () => safePlay());
      hls.on(Hls.Events.ERROR, (_e, data) => {
        if (!data.fatal) return;
        if (data.type === Hls.ErrorTypes.NETWORK_ERROR) {
          hls.startLoad();
        } else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
          hls.recoverMediaError();
        } else {
          destroyHls();
          health[ch.id] = false;
          renderList();
          showError('স্ট্রিম কাজ করছে না', 'সার্ভারটি সাড়া দিচ্ছে না।');
        }
      });
      safePlay();
    } else {
      video.src = ch.url;
      safePlay();
    }
  }

  listEl.addEventListener('click', e => {
    // ব্লক বাটনে ক্লিক করলে
    const blockBtn = e.target.closest('[data-block]');
    if (blockBtn) {
      e.preventDefault(); // যাতে চ্যানেল প্লে না হয়ে যায়
      e.stopPropagation();
      
      const url = blockBtn.dataset.block;
      if (manualBlocked.has(url)) {
        manualBlocked.delete(url); // আনব্লক
      } else {
        manualBlocked.add(url); // ব্লক
      }
      saveBlocked();
      renderList();
      return;
    }

    // চ্যানেলে ক্লিক করলে
    const item = e.target.closest('.ch');
    if (item) playChannel(channels.find(c => c.id === item.dataset.id));
  });

  function syncUI() {
    const paused = video.paused;
    $('#btnPlay').textContent = paused ? '▶' : '❚❚';
    bigPlay.classList.toggle('show', paused && !hasError && !!currentId);
    $('#btnMute').textContent = (video.muted || video.volume === 0) ? '🔇' : '🔊';
    const live = video.duration === Infinity || video.duration === 0 || Number.isNaN(video.duration);
    $('#liveBadge').style.display = (!hasError && currentId && live) ? 'flex' : 'none';
  }

  const togglePlay = () => {
    if (!currentId) return;
    if (video.paused) safePlay(); else video.pause();
  };

  $('#btnPlay').onclick = togglePlay;
  bigPlay.onclick = togglePlay;
  $('#btnMute').onclick = () => { video.muted = !video.muted; syncUI(); };
  volEl.oninput = () => { video.volume = +volEl.value; video.muted = +volEl.value === 0; syncUI(); };
  $('#btnFs').onclick = () => {
    if (!document.fullscreenElement) stage.requestFullscreen?.().catch(() => {});
    else document.exitFullscreen?.();
  };
  $('#btnPip').onclick = () => {
    if (document.pictureInPictureElement) document.exitPictureInPicture?.();
    else video.requestPictureInPicture?.().catch(() => {});
  };
  $('#btnReload').onclick = () => playChannel(channels.find(c => c.id === currentId));

  video.addEventListener('play', syncUI);
  video.addEventListener('pause', syncUI);
  video.addEventListener('playing', () => { hideError(); syncUI(); });
  video.addEventListener('volumechange', syncUI);

  loadMainDatabase();
  syncUI();
})();
</script>
</body>
</html>
